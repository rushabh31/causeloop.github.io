<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A5A"/>
      <stop offset="1" stop-color="#10172E"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="20%" r="60%">
      <stop offset="0" stop-color="#E2603F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E2603F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(96,150)">
    <g transform="scale(1.5)">
      <path d="M48.38 20.53 A20 20 0 1 0 48.38 43.47" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
      <circle cx="48.38" cy="20.53" r="6" fill="#E2603F"/>
    </g>
  </g>

  <text x="96" y="360" font-family="'Schibsted Grotesk',Arial,sans-serif" font-weight="800" font-size="92" letter-spacing="-4" fill="#FFFFFF">causeloop</text>
  <text x="98" y="430" font-family="'Schibsted Grotesk',Arial,sans-serif" font-weight="500" font-size="40" fill="#F4D9D0">Find the <tspan fill="#E2603F">cause</tspan>, break the <tspan fill="#E2603F">loop</tspan>.</text>
  <text x="98" y="500" font-family="Arial,sans-serif" font-size="30" fill="#98A0B5">AI-native risk intelligence for the enterprise</text>
</svg>
