  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@800&amp;display=swap');</style>
    <linearGradient id="clg" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A78FF"/><stop offset="1" stop-color="#1FC2FF"/>
    </linearGradient>
  </defs>
  <rect width="392" height="80" fill="#10172E"/>
  <g transform="translate(8,8)">
